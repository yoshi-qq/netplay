[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netplay"
version = "0.1.0"
description = "Lobbies for small games: LAN over networking with game discovery, internet peer-to-peer over UDP with STUN and join codes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["networking"]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netplay = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = ["netplay"]
